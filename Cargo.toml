[package]
name = "ESPTimer"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "ESPTimer"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = ["std", "esp-idf-svc/native"]
pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = []

[dependencies]
log = { version = "0.4", default-features = false }
esp-idf-svc = { version = "0.51", default-features = false }
embedded-hal = "1.0"
embedded-graphics = "0.8"
mipidsi = "0.10"
anyhow = "1"
embedded-graphics-framebuf = "0.5"
chrono = "0.4.45"
embedded-svc = "0.28.1"
chrono-tz = "0.10.4"

[build-dependencies]
embuild = "0.33"